<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2128" role="img" aria-labelledby="task-F05-title task-F05-desc" font-family="Yu Gothic, Meiryo, sans-serif"><title id="task-F05-title">本人が夜に投稿し、投稿済み・見送り・訂正を報告する</title><desc id="task-F05-desc">本人は、21:30などにこのフローを独立して始めます。翌日日次の手順1は、保存した報告を回収します。自動処理は本人投稿を待ちません。各担当が何のために、何をどうするかを全文で説明します。 各ノードの全文は図の直後の文章表示でも読めます。</desc><defs><marker id="task-F05-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61766e"/></marker></defs><rect width="1200" height="2128" fill="#fff"/><text x="40" y="40" font-size="24" font-weight="400" text-anchor="start" fill="#203c34">本人が夜に投稿し、投稿済み・見送り・訂正を報告する</text><text x="40" y="78" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">緑：プログラムが実行します。　青：AIが考えます。　橙：本人が操作・判断します。</text><g class="diagram-node" data-node="F05-1"><rect x="42" y="118" width="1028" height="250" rx="12" fill="#fff2de" stroke="#9a6b30" stroke-width="1.6"/><text x="67" y="149" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順1　本人（本人）</text><text x="67" y="179" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">本人は、自分が紹介する商品と文章を確認するために、日次処理が作ったHTMLの商品URLと本文を毎日21:</text><text x="67" y="238" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">30などの自分が決めた時刻に読み、使う本文をコピーします。</text><text x="67" y="276" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="305" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本人は、この作業は自動処理から独立しています。自動処理は本人投稿を待たず、コピーやURL閲覧を投稿済みと</text><text x="67" y="334" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">扱いません。</text></g><path d="M 556 368 V 403" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F05-arrow)"/><g class="diagram-node" data-node="F05-2"><rect x="42" y="412" width="1028" height="250" rx="12" fill="#fff2de" stroke="#9a6b30" stroke-width="1.6"/><text x="67" y="443" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順2　本人（本人）</text><text x="67" y="473" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="503" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">本人は、実際の投稿結果を翌日の日次処理へ伝えるために、コピーした本文をROOMへ貼り付けて投稿し、そ</text><text x="67" y="532" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">の後でHTMLの投稿済みチェックを押します。</text><text x="67" y="570" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="599" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本人は、投稿しない商品は見送りを報告し、誤ったチェックは理由を入力して訂正します。システムは未チェック</text><text x="67" y="628" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">を見送りと判断しません。</text></g><path d="M 556 662 V 697" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F05-arrow)"/><g class="diagram-node" data-node="F05-3"><rect x="42" y="706" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="737" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順3　投稿報告の受付プログラム（S-HUMAN-API）</text><text x="67" y="767" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="797" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">投稿報告の受付プログラムは、本人の報告を失わずに受け取るために、HTMLから届く報告番号・商品番号・</text><text x="67" y="826" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">本文の版・操作・訂正理由を確認し、保存担当プログラムへ受付記録の保存を依頼します。</text><text x="67" y="864" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="893" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">投稿報告の受付プログラムは、古いHTMLからの実投稿報告も元の本文の版を特定して受け取ります。同じ報告番</text><text x="67" y="922" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">号の再送は二重登録せず、受付内容の競合は再読込みを求めます。</text></g><path d="M 556 956 V 991" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F05-arrow)"/><g class="diagram-node" data-node="F05-4"><rect x="42" y="1000" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1031" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順4　保存担当プログラム（S-REPO）</text><text x="67" y="1061" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1091" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムは、翌日の日次処理が前日の結果を回収できるようにするために、本人の投稿済み・見</text><text x="67" y="1120" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">送り・訂正の報告をSQLiteの受付記録へ「未反映」として確定保存し、受付成功を画面へ返します。</text><text x="67" y="1158" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1187" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムは、この保存では管理情報の投稿済み・恒久除外・予約をまだ変更しません。管理情報への反</text><text x="67" y="1216" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">映は翌日の「日次処理を開始し、前日の投稿報告を管理情報へ反映する」フローの手順4～6が行います。</text></g><path d="M 556 1250 V 1285" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F05-arrow)"/><g class="diagram-node" data-node="F05-5"><rect x="42" y="1294" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1325" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順5　表示担当プログラム（S-EXPORT）</text><text x="67" y="1355" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1385" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">表示担当プログラムは、本人が報告の保存と管理情報への反映を区別できるようにするために、保存済みの</text><text x="67" y="1414" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">チェックと各報告の反映状態をHTMLへ表示し、「報告保存済み・管理反映待ち」と、翌日の「管理反映済み</text><text x="67" y="1443" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">」を区別します。</text><text x="67" y="1481" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1510" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">表示担当プログラムは、再読込みで保存済みの報告を復元し、受付保存が失敗した場合は成功と表示しません。日</text><text x="67" y="1539" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">次終了後も報告を受け付けます。</text></g><path d="M 556 1573 V 1608" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F05-arrow)"/><g class="diagram-node" data-node="F05-6"><rect x="42" y="1617" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1648" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順6　保存担当プログラム（S-REPO）</text><text x="67" y="1678" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1708" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムは、古い本文や翌日の投稿でも元の作成履歴を守るために、過去に作った本文の投稿報</text><text x="67" y="1737" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">告と、対応する元の本文の版を受付記録へ保存して翌日回収の対象にし、作成日・実投稿日時・報告日時を</text><text x="67" y="1766" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">分けて残します。</text><text x="67" y="1804" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1833" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムは、本人が投稿を忘れて翌日に投稿した場合も、その報告を次の日次で反映します。日次の15</text><text x="67" y="1862" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本文に持越し分を加算しません。</text></g><text x="42" y="1944" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">分かれ道・戻り道の説明</text><text x="42" y="1979" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本人は、毎日21:30などの自分が決めた時刻に、この独立したフローを始めます。自動処理はこの操作を待たずに完了します。</text><text x="42" y="2028" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">投稿報告の受付プログラムは、日次終了後も投稿・見送り・訂正を未反映の受付記録へ保存します。翌日の開始・投稿報告反映</text><text x="42" y="2057" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">フローは、その報告を回収して管理情報へ反映します。21:30は自動起動の時刻や必須の締切ではありません。</text></svg>