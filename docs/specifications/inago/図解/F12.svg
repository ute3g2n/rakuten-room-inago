<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2459" role="img" aria-labelledby="task-F12-title task-F12-desc" font-family="Yu Gothic, Meiryo, sans-serif"><title id="task-F12-title">日次後の保守確認から障害対応・次回観測まで</title><desc id="task-F12-desc">自動不具合対応の各stageは、担当と不可欠な対象・入力があれば担当agentを実起動します。reviewerは対象versionまたは成果物があれば必ず実起動します。前段status、任意証拠、receipt、runtime設定観測、session/cache状態で起動や後続工程を止めず、失敗・未確認を記録してreportまで進みます。各担当が何のために、何をどうするかを全文で説明します。 各ノードの全文は図の直後の文章表示でも読めます。</desc><defs><marker id="task-F12-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61766e"/></marker></defs><rect width="1200" height="2459" fill="#fff"/><text x="40" y="40" font-size="24" font-weight="400" text-anchor="start" fill="#203c34">日次後の保守確認から障害対応・次回観測まで</text><text x="40" y="78" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">緑：プログラムが実行します。　青：AIが考えます。　橙：本人が操作・判断します。</text><g class="diagram-node" data-node="F12-1"><rect x="42" y="118" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="149" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順1　完了通知・監視プログラム（maintenance completion / watchdog）</text><text x="67" y="179" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">完了通知・監視プログラムは、日次の実際の終了状態を保守担当へ正確に渡すために、日次CLI最終結果、</text><text x="67" y="238" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">後処理、保全、プロセス終了、起動IDを照合し、記録できる証拠参照と対象日を管理DBへ渡します。</text><text x="67" y="276" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="305" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">完了通知・監視プログラムは、保存runがない起動前停止ではrun IDを作らずsource_run_id=nullを保ち</text><text x="67" y="334" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">、元のfailed結果や欠測を成功扱いにしません。</text></g><path d="M 556 368 V 403" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-2"><rect x="42" y="412" width="1028" height="250" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="443" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順2　親A・調査担当（rr-inago-incident-investigation）</text><text x="67" y="473" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="503" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">親A・調査担当は、正常な結果と調査が必要な事象を分けるために、日次結果と利用可能な証拠を受け取り、</text><text x="67" y="532" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">Sol/high設定で調査agentを実起動して確認済みの事実・外部要因・未知を分類します。</text><text x="67" y="570" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="599" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">親A・調査担当は、対象jobと担当stageが分かり必須入力があれば直ちに起動します。任意の証拠・status・r</text><text x="67" y="628" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">eceipt・設定観測で起動を遅らせず、未確認事項を記録して後続へ渡します。</text></g><path d="M 556 662 V 697" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-3"><rect x="42" y="706" width="1028" height="337" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="737" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順3　案件管理プログラム（maintenance controller / store）</text><text x="67" y="767" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="797" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">案件管理プログラムは、同じ起動・障害の履歴をIDで追跡するために、source_launch_id、nullable</text><text x="67" y="826" font-size="20" font-weight="400" text-anchor="start" fill="#203c34"> source_run_id、target_date、check/incidentの記録を管理DBへ記録し、前工程のstatusを</text><text x="67" y="855" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">次stageの開始条件にしません。</text><text x="67" y="893" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="922" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">案件管理プログラムは、U23の現在方針ではrelease/readiness gateで後続stageを止めません。report</text><text x="67" y="951" font-size="19" font-weight="400" text-anchor="start" fill="#203c34"> completeだけがjob complete/incident resolved/Worker成功へ対応し、pending/blockedはa</text><text x="67" y="980" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">rtifactを保持して未完了statusを記録します。同一起動・同一事象の確認記録は重複させず、元の日次結果を</text><text x="67" y="1009" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">保持します。</text></g><path d="M 556 1043 V 1078" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-4"><rect x="42" y="1087" width="1028" height="308" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="1118" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順4　親A・調査/計画担当とreviewer（investigation / execution planning）</text><text x="67" y="1148" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1178" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">親A・調査/計画担当とreviewerは、確認できた事実と未確認事項を次の作業へ渡すために、利用可能な調</text><text x="67" y="1207" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">査MD/facts/evidence、現行要件、0～14節計画と対応表を使って計画agentを実起動し、対象versi</text><text x="67" y="1236" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">onまたは成果物があれば別担当reviewerを実起動してreviewを依頼します。</text><text x="67" y="1274" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1303" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">親A・調査/計画担当とreviewerは、必須対象がある担当を直ちに起動します。任意証拠・status・receipt</text><text x="67" y="1332" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">・設定観測・session/cache状態は起動条件にせず、原因unknownや欠測も後続stageへ渡します。source</text><text x="67" y="1361" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">_run_id=nullはnullのまま保ちます。</text></g><path d="M 556 1395 V 1430" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-5"><rect x="42" y="1439" width="1028" height="308" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="1470" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順5　親B・実装/テスト/レビュー担当（common-implementation / testing / review）</text><text x="67" y="1500" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1530" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">親B・実装/テスト/レビュー担当は、確認できる不具合を利用可能な情報で修正するために、利用可能な計</text><text x="67" y="1559" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">画と担当範囲の変更対象・試験対象・review対象version/artifactを使って実装/試験agentを実起</text><text x="67" y="1588" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">動し、通常のローカルpytestと製品コードreviewを依頼します。</text><text x="67" y="1626" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1655" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">親B・実装/テスト/レビュー担当は、レビュー対象があれば実reviewerを起動し、未起動を合成unavailable</text><text x="67" y="1684" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">にしません。テストコードは独立reviewしません。失敗・未実施・review所見を次工程へ渡し、PASS/承認を</text><text x="67" y="1713" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">反映条件にしません。</text></g><path d="M 556 1747 V 1782" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-6"><rect x="42" y="1791" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1822" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順6　本番反映プログラム（maintenance deployment）</text><text x="67" y="1852" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1882" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">本番反映プログラムは、実行可能な修正を反映できる範囲で試み、結果を記録するために、利用可能な修正</text><text x="67" y="1911" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">候補と反映対象環境を確認し、実行可能な反映操作を試して実際の反映版と未実施操作を記録します。</text><text x="67" y="1949" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1978" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本番反映プログラムは、test/review/readiness statusを後続gateにしません。個別操作を実行できな</text><text x="67" y="2007" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">い場合はその理由を記録し、報告へ進みます。</text></g><path d="M 556 2041 V 2076" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-7"><rect x="42" y="2085" width="1028" height="308" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="2116" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順7　親B・報告担当とreviewer（rr-inago-incident-report）</text><text x="67" y="2146" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="2176" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">親B・報告担当とreviewerは、何が起き、どこまで対応できたか利用者へ伝えるために、利用可能な調査・</text><text x="67" y="2205" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">計画・試験・review・反映記録と元件数をreport担当へ渡してHTMLを作成し、review対象HTML版また</text><text x="67" y="2234" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">は成果物があれば別担当reviewerを実起動してreviewを依頼します。review所見があればreport担当</text><text x="67" y="2263" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">が自ら修正します。</text><text x="67" y="2301" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="2330" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">親B・報告担当とreviewerは、任意証拠や前段statusで担当の起動を止めず、review未起動を合成unavail</text><text x="67" y="2359" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">ableで置き換えません。review承認をreport完了条件にせず、未確認と未実施を明記します。</text></g></svg>