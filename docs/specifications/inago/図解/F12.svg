<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2405" role="img" aria-labelledby="task-F12-title task-F12-desc" font-family="Yu Gothic, Meiryo, sans-serif"><title id="task-F12-title">日次後の保守確認から障害対応・次回観測まで</title><desc id="task-F12-desc">日次後checkから、調査・実装・試験・別製品review・反映・報告・別HTML review・公開を6 skillsの8呼出しで同じ案件内に順に進めます。各担当は前担当のMarkdownを読み、失敗や原因不明でも後続を止めません。各担当が何のために、何をどうするかを全文で説明します。同じjob内で6 skillsの8担当を順に呼び出し、各担当は前担当のMarkdown成果を実際に読んで自分の担当成果を保存します。handoffは担当・入力・依頼の3項目だけです。製品差分は試験・独立review・反映へ、日次原因が不明でも次回診断に役立つ日次計装は同じjobの実装・試験・独立review・本番読戻しへ渡します。reporterがHTMLを直接作成・修正し、別reviewerは4点の正確さと分かりやすさ、秘密露出だけを確認します。公開版は作者修正後のreview対象と同じbytesです。操作・公開・workflow完遂・元障害解消を分け、原因不明を解決済みにしません。 各ノードの全文は図の直後の文章表示でも読めます。</desc><defs><marker id="task-F12-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61766e"/></marker></defs><rect width="1200" height="2405" fill="#fff"/><text x="40" y="40" font-size="24" font-weight="400" text-anchor="start" fill="#203c34">日次後の保守確認から障害対応・次回観測まで</text><text x="40" y="78" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">緑：プログラムが実行します。　青：AIが考えます。　橙：本人が操作・判断します。</text><g class="diagram-node" data-node="F12-1"><rect x="42" y="118" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="149" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順1　日次後check（daily check）</text><text x="67" y="179" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">日次後checkは、日次結果の事実と未知を区別し、対象jobを選びますために、既存Dailyの記録と対象jo</text><text x="67" y="238" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">bの正式identityを正常日ならcheckだけで終え、異常・未知なら同じjobの調査へ渡します。</text><text x="67" y="276" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="305" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次後checkは、10/17 source_run_id=nullを保ち、10/19 queue/historyや通常Dailyを再処理し</text><text x="67" y="334" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">ません。</text></g><path d="M 556 368 V 403" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-2"><rect x="42" y="412" width="1028" height="221" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="443" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順2　調査担当（rr-inago-incident-investigation）</text><text x="67" y="473" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="503" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">調査担当は、原因・根拠・未確認と次の診断候補を調べますために、incident.mdとjob資料、許可され</text><text x="67" y="532" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">た原記録を同jobのinvestigation.mdを作り、次担当へ渡します。</text><text x="67" y="570" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="599" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">調査担当は、原因不明でも起動し、証拠のない因果を断定しません。</text></g><path d="M 556 633 V 668" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-3"><rect x="42" y="677" width="1028" height="221" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="708" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順3　実装担当（common-implementation）</text><text x="67" y="738" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="768" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">実装担当は、原因修正または次回診断に役立つ日次計装を実装しますために、調査成果と承認計画の割当差</text><text x="67" y="797" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">分を製品差分とimplementation.mdを作り、次担当へ渡します。</text><text x="67" y="835" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="864" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">実装担当は、保守runnerのログだけで日次実装を代替しません。</text></g><path d="M 556 898 V 933" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-4"><rect x="42" y="942" width="1028" height="221" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="973" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順4　試験担当（common-testing）</text><text x="67" y="1003" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1033" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">試験担当は、指定された製品差分の試験結果を記録しますために、実装成果と計画指定caseを通常pytest</text><text x="67" y="1062" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">を実行し、期待/実結果をtest.mdに記録します。</text><text x="67" y="1100" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1129" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">試験担当は、FAILや未実施を後続のgateにせず、日次業務DBを使いません。</text></g><path d="M 556 1163 V 1198" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-5"><rect x="42" y="1207" width="1028" height="221" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="1238" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順5　別製品reviewer（common-review）</text><text x="67" y="1268" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1298" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">別製品reviewerは、実装と試験証拠を別sessionから確認しますために、日次製品差分とtest.mdをre</text><text x="67" y="1327" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">view所見をcode-review.mdに記録します。</text><text x="67" y="1365" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1394" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">別製品reviewerは、review結果にかかわらず反映担当へ渡します。</text></g><path d="M 556 1428 V 1463" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-6"><rect x="42" y="1472" width="1028" height="221" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1503" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順6　反映担当（rr-inago-maintenance-delivery）</text><text x="67" y="1533" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1563" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">反映担当は、選択された製品差分を確認して本番へ反映しますために、実装・試験・review成果と現在のt</text><text x="67" y="1592" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">racking先を所有差分を選択して適用し、版をread-backしてdeployment.mdに記録します。</text><text x="67" y="1630" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1659" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">反映担当は、実際にできない操作だけ理由付きで残し、次担当へ進みます。</text></g><path d="M 556 1693 V 1728" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-7"><rect x="42" y="1737" width="1028" height="308" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="1768" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順7　報告者と別HTML reviewer（rr-inago-incident-report / common-review）</text><text x="67" y="1798" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1828" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">報告者と別HTML reviewerは、同jobの結果を平易なHTMLへまとめ、本文の4点だけを独立確認しますた</text><text x="67" y="1857" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">めに、実際の調査・実装・試験・review・反映記録をreporterがreport.htmlを直接作成し、別sess</text><text x="67" y="1886" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">ion reviewerが読んでhtml-review.mdを作ります。指摘はreporterが同じauthor sessionで</text><text x="67" y="1915" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">修正します。</text><text x="67" y="1953" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1982" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">報告者と別HTML reviewerは、不具合・原因・修正・追加trace/logを正確に伝え、秘密露出だけを確認しま</text><text x="67" y="2011" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">す。</text></g><path d="M 556 2045 V 2080" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-8"><rect x="42" y="2089" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="2120" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順8　公開担当（rr-inago-maintenance-delivery）</text><text x="67" y="2150" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="2180" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">公開担当は、作者修正後のreview済みbytesを公開先から読み戻しますために、report.html、html-</text><text x="67" y="2209" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">review.md、reporter修正版を同一bytesを公開してpublication.mdに参照とhashを記録します</text><text x="67" y="2238" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">。</text><text x="67" y="2276" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="2305" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">公開担当は、公開・工程完遂・元障害解消を別々に記録します。</text></g></svg>