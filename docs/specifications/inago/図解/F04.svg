<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2361" role="img" aria-labelledby="task-F04-title task-F04-desc" font-family="Yu Gothic, Meiryo, sans-serif"><title id="task-F04-title">商品の紹介文を生成し、確定保存する</title><desc id="task-F04-desc">この詳細図は、全体図の手順4を説明します。日次制御プログラムは本文保存後に必要件数を確認し、足りなければ手順3、前工程が終われば手順5へ進みます。各担当が何のために、何をどうするかを全文で説明します。 各ノードの全文は図の直後の文章表示でも読めます。</desc><defs><marker id="task-F04-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61766e"/></marker></defs><rect width="1200" height="2361" fill="#fff"/><text x="40" y="40" font-size="24" font-weight="400" text-anchor="start" fill="#203c34">商品の紹介文を生成し、確定保存する</text><text x="40" y="78" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">緑：プログラムが実行します。　青：AIが考えます。　橙：本人が操作・判断します。</text><g class="diagram-node" data-node="F04-1"><rect x="42" y="118" width="1028" height="221" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="149" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順1　日次制御プログラム（ORCH-S）</text><text x="67" y="179" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、AIが別の商品や設定で文章を作るのを防ぐために、対象商品の店舗と商品番号、本</text><text x="67" y="238" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">文の版、残り時間を固定し、この商品の本文を作るようAI起動担当プログラムへ依頼します。</text><text x="67" y="276" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="305" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、すでに保存済みの本文を作り直さず、まだ完成していない商品だけを依頼します。</text></g><path d="M 556 339 V 383" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F04-arrow)"/><g class="diagram-node" data-node="F04-2"><rect x="42" y="383" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="414" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順2　日次指揮AIとAI受け渡しプログラム（AI-O／S-AI-RUNNER）</text><text x="67" y="444" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="474" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">日次指揮AIとAI受け渡しプログラムは、正しい専門役へ本文作成を依頼するために、商品情報、本文版、専</text><text x="67" y="503" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">用指示書、入力参照、回答形式を記録し、AI-Oが同じ実行内の本文作成サブエージェントへ委譲して最終回</text><text x="67" y="532" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">答を受け取ります。</text><text x="67" y="570" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="599" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次指揮AIとAI受け渡しプログラムは、専門役を別CLIで起動する方式と混同せず、実在するroot・native子</text><text x="67" y="628" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">実行・モデル・時刻・採否を記録します。</text></g><path d="M 556 662 V 706" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F04-arrow)"/><g class="diagram-node" data-node="F04-3"><rect x="42" y="706" width="1028" height="250" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="737" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順3　本文作成AI（AG-COPY）</text><text x="67" y="767" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="797" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">本文作成AIは、本人がその商品の紹介文を貼り付けて使えるようにするために、受け取った商品情報と文章</text><text x="67" y="826" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">の型を読み、日本語の本文を1案作り、対象商品の番号と本文の版を添えてAI起動担当プログラムへ返しま</text><text x="67" y="855" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">す。</text><text x="67" y="893" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="922" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本文作成AIは、本文を空のまま成功と報告せず、分からない商品情報を確認するための別審査を追加しません。</text></g><path d="M 556 956 V 1000" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F04-arrow)"/><g class="diagram-node" data-node="F04-4"><rect x="42" y="1000" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1031" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順4　AI起動担当プログラムと保存担当プログラム（S-AI-RUNNER／S-REPO）</text><text x="67" y="1061" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1091" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">AI起動担当プログラムと保存担当プログラムは、保存に失敗しても本文を失わず、別商品の結果を誤って保</text><text x="67" y="1120" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">存しないようにするために、AIが返した本文を一時ファイルへ保存し、回答形式・商品番号・本文の版・終</text><text x="67" y="1149" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">了時刻が依頼と一致するか確認します。</text><text x="67" y="1187" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1216" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">AI起動担当プログラムと保存担当プログラムは、個別job timeout後に到着した本文（17:45/18:00を過ぎ</text><text x="67" y="1245" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">たことだけでは拒否しない）を完成に数えず、その回答と採用しなかった理由を残します。</text></g><path d="M 556 1279 V 1323" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F04-arrow)"/><g class="diagram-node" data-node="F04-5"><rect x="42" y="1323" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1354" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順5　保存担当プログラム（S-REPO）</text><text x="67" y="1384" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1414" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムは、本文だけが保存され、投稿待ちの目印や件数が欠ける状態を防ぐために、本文、投</text><text x="67" y="1443" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">稿待ちの商品の目印、完成件数を一つのまとまった保存処理で書き込み、全部成功した場合だけ保存を確定</text><text x="67" y="1472" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">します。</text><text x="67" y="1510" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1539" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムは、保存直前に投稿済み・予約・未反映の投稿済み報告を確認します。競合商品を確定せず、</text><text x="67" y="1568" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">保存だけの失敗は一時本文からやり直します。</text></g><path d="M 556 1602 V 1646" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F04-arrow)"/><g class="diagram-node" data-node="F04-6"><rect x="42" y="1646" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1677" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順6　保存担当プログラムと表示担当プログラム（S-REPO／S-EXPORT）</text><text x="67" y="1707" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1737" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムと表示担当プログラムは、本人へ実際に保存できた本文だけを渡すために、保存成功し</text><text x="67" y="1766" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">た本文と更新した完成件数を日次制御プログラムへ知らせ、HTMLへ表示します。</text><text x="67" y="1804" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1833" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムと表示担当プログラムは、生成しただけの本文を完成と数えず、HTML出力だけが失敗した場</text><text x="67" y="1862" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">合は保存済みの本文から表示を作り直します。</text></g><g class="diagram-node" data-node="F04-7"><rect x="42" y="1940" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1971" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順7　AI起動担当プログラムと日次制御プログラム（S-AI-RUNNER／ORCH-S）</text><text x="67" y="2001" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="2031" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">AI起動担当プログラムと日次制御プログラムは、文章を作れなかった商品だけをやり直すために、空本文ま</text><text x="67" y="2060" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">たは生成エラーになった商品を初回の後に最大2回だけ再生成し、それでも本文ができなければ別の商品へ交</text><text x="67" y="2089" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">換します。</text><text x="67" y="2127" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="2156" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">AI起動担当プログラムと日次制御プログラムは、本文はできていて保存だけが失敗した場合は、同じ本文を再保存</text><text x="67" y="2185" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">し、AIに本文を作り直させません。</text></g><path d="M 1070 831 H 1116 V 2079.5 H 1070" fill="none" stroke="#61766e" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#task-F04-arrow)"/><path d="M 1070 2193 H 1170 V 228.5 H 1070" fill="none" stroke="#61766e" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#task-F04-arrow)"/><text x="42" y="2263" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">実線の矢印は、担当プログラムやAIが手順1から手順6まで順に処理する流れを表します。</text><text x="42" y="2301" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">破線の矢印は、手順3の生成に失敗した場合だけ手順7へ進み、手順1から依頼し直す流れです。</text></svg>