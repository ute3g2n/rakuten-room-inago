<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2344" role="img" aria-labelledby="task-F03-title task-F03-desc" font-family="Yu Gothic, Meiryo, sans-serif"><title id="task-F03-title">本日の検索語と候補商品を選び、不足分を探す</title><desc id="task-F03-desc">この詳細図は、全体図の手順2・3を説明します。選択プログラムは商品を全体の手順4へ渡します。日次制御プログラムは保存後に不足していれば手順3へ戻り、必要に応じて手順2で別語句を選びます。各担当が何のために、何をどうするかを全文で説明します。 各ノードの全文は図の直後の文章表示でも読めます。</desc><defs><marker id="task-F03-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61766e"/></marker></defs><rect width="1200" height="2344" fill="#fff"/><text x="40" y="40" font-size="24" font-weight="400" text-anchor="start" fill="#203c34">本日の検索語と候補商品を選び、不足分を探す</text><text x="40" y="78" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">緑：プログラムが実行します。　青：AIが考えます。　橙：本人が操作・判断します。</text><g class="diagram-node" data-node="F03-1"><rect x="42" y="118" width="1028" height="221" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="149" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順1　テーマ選択担当プログラム（S-SELECTION）</text><text x="67" y="179" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">テーマ選択担当プログラムは、特定のテーマだけが選ばれ続けるのを防ぐために、これまで選ばれた回数が</text><text x="67" y="238" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">少ない3テーマを優先して選び、同じ回数のテーマが並ぶ場合は抽選で決めます。</text><text x="67" y="276" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="305" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">テーマ選択担当プログラムは、抽選結果と再現用の記録を保存し、途中から再開してもテーマを引き直しません。</text></g><path d="M 556 339 V 374" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F03-arrow)"/><g class="diagram-node" data-node="F03-2"><rect x="42" y="383" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="414" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順2　人気語取得担当プログラム（S-TRENDS）</text><text x="67" y="444" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="474" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">人気語取得担当プログラムは、当日の情報を使って検索語を選ぶために、選んだテーマや語に関連する人気</text><text x="67" y="503" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">語と人気順をGoogle Trendsから取得し、日本のウェブ検索・過去90日間という条件と取得日時も保存し</text><text x="67" y="532" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">ます。</text><text x="67" y="570" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="599" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">人気語取得担当プログラムは、取得に失敗した場合は当日の語句選びを停止し、保存済みの本文を残して成果取得</text><text x="67" y="628" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">へ進めます。</text></g><path d="M 556 662 V 697" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F03-arrow)"/><g class="diagram-node" data-node="F03-3"><rect x="42" y="706" width="1028" height="250" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="737" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順3　検索語判断AI（AG-KEY）</text><text x="67" y="767" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="797" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">検索語判断AIは、広い分類から細かい商品分類へ絞って検索できるようにするために、取得した語を読み、</text><text x="67" y="826" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">「揚げ物→唐揚げ→鶏の唐揚げ」のような分類を表す語だけを残し、残す理由も返します。</text><text x="67" y="864" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="893" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">検索語判断AIは、残せる語が0でも語を創作せず、取得自体は成功している場合に限って別の語やテーマへ進む判</text><text x="67" y="922" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">断をプログラムへ渡します。</text></g><path d="M 556 956 V 991" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F03-arrow)"/><g class="diagram-node" data-node="F03-4"><rect x="42" y="1000" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1031" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順4　検索語選択担当プログラム（S-SELECTION）</text><text x="67" y="1061" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1091" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">検索語選択担当プログラムは、実際に取得した候補の中から偏りなく検索語を選ぶために、第1階層の上位最</text><text x="67" y="1120" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">大20語と第2階層の上位最大10語を実際の人気順で並べ、それぞれの候補から抽選し、使う語と抽選結果を</text><text x="67" y="1149" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">保存します。</text><text x="67" y="1187" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1216" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">検索語選択担当プログラムは、候補が7語や3語ならその実数だけを使い、AIが考えた語で人気順の空きを埋めま</text><text x="67" y="1245" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">せん。</text></g><path d="M 556 1279 V 1314" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F03-arrow)"/><g class="diagram-node" data-node="F03-5"><rect x="42" y="1323" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1354" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順5　商品検索担当プログラム（S-ROOM）</text><text x="67" y="1384" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1414" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">商品検索担当プログラムは、選んだテーマで5件の本文を作れる商品を探すために、第1階層と第2階層を組</text><text x="67" y="1443" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">み合わせた検索語を使ってROOMを検索し、足りなければ第1階層の語だけで追加検索します。</text><text x="67" y="1481" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1510" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">商品検索担当プログラムは、1検索でいいね300以上の最大50投稿を取り、失敗後のやり直しも含めて1日9回まで</text><text x="67" y="1539" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">と数えます。</text></g><path d="M 556 1573 V 1608" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F03-arrow)"/><g class="diagram-node" data-node="F03-6"><rect x="42" y="1617" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1648" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順6　商品選択担当プログラム（S-SELECTION／AG-COPY／S-REPO）</text><text x="67" y="1678" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1708" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">商品選択担当プログラムは、同じ商品を重ねずに使える本文を増やすために、集めた投稿の商品を店舗と商</text><text x="67" y="1737" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">品番号でまとめ、最もいいねが多い投稿を代表にし、未投稿・未予約の商品だけを本文作成AIへ渡します。</text><text x="67" y="1775" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1804" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">商品選択担当プログラムは、選出した商品を日次全体の手順4の本文生成・保存フローへ渡し、保存が成功した商</text><text x="67" y="1833" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">品だけを完成として数えます。</text></g><path d="M 556 1867 V 1902" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F03-arrow)"/><g class="diagram-node" data-node="F03-7"><rect x="42" y="1911" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1942" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順7　日次制御プログラム（ORCH-S）</text><text x="67" y="1972" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="2002" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、15件に足りない本文を残りの検索枠で補うために、まだ使っていない語の組合せ、</text><text x="67" y="2031" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">次に別のテーマを順に選び、同じ検索手順を繰り返して不足分の商品を探します。</text><text x="67" y="2069" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="2098" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、15件が揃う、9検索を使い切る、候補がなくなる、取得不能になる、17:45に達する場合</text><text x="67" y="2127" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">は探索を終え、直ちに成果取得を始めます。</text></g><path d="M 1070 2036 H 1134 V 522.5 H 1074" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F03-arrow)"/><text x="42" y="2209" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">分かれ道・戻り道の説明</text><text x="42" y="2244" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、本文が15件に足りず検索回数と時刻に余裕がある場合、次の語やテーマを選び、人気語を取得する手順</text><text x="42" y="2273" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">へ戻します。</text></svg>