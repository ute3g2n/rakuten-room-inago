<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2645" role="img" aria-labelledby="task-F03-title task-F03-desc" font-family="Yu Gothic, Meiryo, sans-serif"><title id="task-F03-title">本日の検索語と候補商品を選び、不足分を探す</title><desc id="task-F03-desc">この詳細図は、全体図の手順2・3を説明します。選択プログラムは商品を全体の手順4へ渡します。日次制御プログラムは保存後に不足していれば手順3へ戻り、必要に応じて手順2で別語句を選びます。各担当が何のために、何をどうするかを全文で説明します。 各ノードの全文は図の直後の文章表示でも読めます。</desc><defs><marker id="task-F03-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61766e"/></marker></defs><rect width="1200" height="2645" fill="#fff"/><text x="40" y="40" font-size="24" font-weight="400" text-anchor="start" fill="#203c34">本日の検索語と候補商品を選び、不足分を探す</text><text x="40" y="78" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">緑：プログラムが実行します。　青：AIが考えます。　橙：本人が操作・判断します。</text><g class="diagram-node" data-node="F03-1"><rect x="42" y="118" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="149" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順1　テーマ選択担当プログラム（S-SELECTION）</text><text x="67" y="179" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">テーマ選択担当プログラムは、特定のテーマだけが選ばれ続けるのを防ぐために、採用済みの有効テーマと</text><text x="67" y="238" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">選択回数を少ない順を優先し同点は抽選して、初期3テーマと処理順を保存します。追加が必要なら未試行テ</text><text x="67" y="267" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">ーマを一つ選びます。</text><text x="67" y="305" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="334" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">テーマ選択担当プログラムは、初期3テーマを順に処理し、再開時や補充の戻り道で最初の3テーマを選び直しませ</text><text x="67" y="363" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">ん。抽選結果と使用済み集合を維持します。</text></g><path d="M 556 397 V 432" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F03-arrow)"/><g class="diagram-node" data-node="F03-2"><rect x="42" y="441" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="472" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順2　人気語取得担当プログラム（S-TRENDS）</text><text x="67" y="502" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="532" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">人気語取得担当プログラムは、今日の関連人気語を検索に使うために、テーマの検索語、日本・Web・過去3</text><text x="67" y="561" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">か月の公開ExploreをPlaywrightで操作し、関連キーワード人気Topの先頭20件と元順位・原表現・条</text><text x="67" y="590" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">件・取得時刻を保存します。</text><text x="67" y="628" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="657" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">人気語取得担当プログラムは、旧結果の残存を受理せず、取得失敗なら当日語句選びを停止します。Alpha API</text><text x="67" y="686" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">を必須にしません。</text></g><path d="M 556 720 V 755" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F03-arrow)"/><g class="diagram-node" data-node="F03-3"><rect x="42" y="764" width="1028" height="250" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="795" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順3　検索語判断サブエージェント（AG-KEY）</text><text x="67" y="825" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="855" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">検索語判断サブエージェントは、同じ意味の関連語を重ねずに検索するために、検索対象とTop20の観測語</text><text x="67" y="884" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">番号・原表現を読み、検索語句そのものと意味の重複グループを理由付きで返します。</text><text x="67" y="922" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="951" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">検索語判断サブエージェントは、第1・第2階層を作らず、未取得語を追加しません。共通語があるだけで意味が異</text><text x="67" y="980" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">なる候補を同義と断定しません。</text></g><path d="M 556 1014 V 1049" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F03-arrow)"/><g class="diagram-node" data-node="F03-4"><rect x="42" y="1058" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1089" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順4　検索語選択担当プログラム（S-SELECTION）</text><text x="67" y="1119" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1149" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">検索語選択担当プログラムは、重複のない取得候補から検索表現を選ぶために、検索語そのものを除いた重</text><text x="67" y="1178" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">複グループを最大5グループを均等抽選し、各グループ内の原表現も均等抽選して結果とseedを保存します</text><text x="67" y="1207" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">。</text><text x="67" y="1245" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1274" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">検索語選択担当プログラムは、候補3語なら3語を使います。Top21件目以降やAI新語で穴埋めせず、原表現をそ</text><text x="67" y="1303" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">のままROOMへ渡します。</text></g><path d="M 556 1337 V 1372" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F03-arrow)"/><g class="diagram-node" data-node="F03-5"><rect x="42" y="1381" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1412" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順5　商品検索担当プログラム（S-ROOM）</text><text x="67" y="1442" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1472" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">商品検索担当プログラムは、選択した表現に対応する紹介投稿を取得するために、保存順の未試行関連語と</text><text x="67" y="1501" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">いいね300以上・コメント条件なしをROOM一覧へ実反映させ、先頭50投稿を受理し、商品IDを実API応答</text><text x="67" y="1530" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">かROOMから開いた商品ページのURLから取得します。</text><text x="67" y="1568" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1597" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">商品検索担当プログラムは、80表示でも残30は使いません。50未満の正常終端は実数、取得失敗は別状態です。</text><text x="67" y="1626" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">いいね数や恒久ROOM投稿IDは必須にしません。</text></g><path d="M 556 1660 V 1695" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F03-arrow)"/><g class="diagram-node" data-node="F03-6"><rect x="42" y="1704" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1735" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順6　商品選択担当プログラム（S-SELECTION／AG-COPY／S-REPO）</text><text x="67" y="1765" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1795" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">商品選択担当プログラムは、同じ店舗商品を重ねずに本文を増やすために、集めた投稿の店舗と商品番号を</text><text x="67" y="1824" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">キーでまとめ、最初に取得した投稿を代表にし、未投稿・未予約の商品を取得順に本文作成サブエージェン</text><text x="67" y="1853" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">トへ渡します。</text><text x="67" y="1891" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1920" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">商品選択担当プログラムは、別店舗・別商品ページのIDなら元から別商品。商品IDを実在するROOM投稿IDだと</text><text x="67" y="1949" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">偽らず、確定保存成功だけを完成に数えます。</text></g><path d="M 556 1983 V 2018" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F03-arrow)"/><g class="diagram-node" data-node="F03-7"><rect x="42" y="2027" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="2058" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順7　日次制御プログラム（ORCH-S）</text><text x="67" y="2088" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="2118" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、テーマの5商品と日次15件に不足する本文を補うために、現在テーマの残り関連語</text><text x="67" y="2147" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">、テーマ単独、次の初期または追加テーマを不足時だけ残り関連語を手順5へ渡し、使い切ったらテーマ単独</text><text x="67" y="2176" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">を同じ300条件で1回検索します。テーマ処理終了後、次テーマを手順2へ渡します。</text><text x="67" y="2214" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="2243" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、初期3テーマ後も15未達なら別テーマで残数を補います。回数上限はなく、15件・未試行</text><text x="67" y="2272" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">候補枯渇・取得不能・17:45で探索を終え、直ちに成果取得を始めます。</text></g><path d="M 1070 2166.5 H 1134 V 1520.5 H 1070" fill="none" stroke="#61766e" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#task-F03-arrow)"/><path d="M 1070 2280 H 1170 V 257.5 H 1070" fill="none" stroke="#61766e" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#task-F03-arrow)"/><path d="M 1070 2166.5 H 1134 V 580.5 H 1074" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F03-arrow)"/><text x="42" y="2354" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">分かれ道・戻り道の説明</text><text x="42" y="2389" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、1テーマ5件に不足すれば保存順の次の関連語を手順5へ渡し、関連語を使い切っても不足ならテーマ語</text><text x="42" y="2418" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">句だけで300条件の検索を1回行います。関連語0件の正常取得もテーマ単独へ進みます。</text><text x="42" y="2467" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">現在テーマの5件達成またはテーマ単独検索終了後に次の初期テーマへ進みます。初期3テーマ後に15未達なら未試行テーマを</text><text x="42" y="2496" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">追加し、残数だけを補います。関連語で5件揃えば残りの語やテーマ単独を検索しません。</text><text x="42" y="2545" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">検索回数の数値上限はありません。15件・未試行候補枯渇・取得不能・17:45で終了します。再開では語順・使用済み語・テ</text><text x="42" y="2574" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">ーマ単独の実施済み印・確定件数を維持します。</text></svg>