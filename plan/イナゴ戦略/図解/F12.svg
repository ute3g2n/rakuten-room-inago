<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2372" role="img" aria-labelledby="task-F12-title task-F12-desc" font-family="Yu Gothic, Meiryo, sans-serif"><title id="task-F12-title">日次後の保守確認から障害対応・次回観測まで</title><desc id="task-F12-desc">この新しい保守フローは、日次の最終結果と後処理が確定した後だけ開始します。正常日・根拠ある不足はcheck記録だけで終わり、異常・未知の時だけincidentへ進みます。基盤ready後の遡及案件、本番反映、次の自然な日次確認も同じ案件IDと版で追跡します。各担当が何のために、何をどうするかを全文で説明します。 各ノードの全文は図の直後の文章表示でも読めます。</desc><defs><marker id="task-F12-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61766e"/></marker></defs><rect width="1200" height="2372" fill="#fff"/><text x="40" y="40" font-size="24" font-weight="400" text-anchor="start" fill="#203c34">日次後の保守確認から障害対応・次回観測まで</text><text x="40" y="78" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">緑：プログラムが実行します。　青：AIが考えます。　橙：本人が操作・判断します。</text><g class="diagram-node" data-node="F12-1"><rect x="42" y="118" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="149" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順1　完了通知・監視プログラム（maintenance completion / watchdog）</text><text x="67" y="179" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">完了通知・監視プログラムは、日次の実際の終了状態を保守担当へ正確に渡すために、日次CLI最終結果、</text><text x="67" y="238" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">後処理、保全、プロセス終了、起動IDを照合し、記録できる証拠参照と対象日を管理DBへ渡します。</text><text x="67" y="276" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="305" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">完了通知・監視プログラムは、保存runがない起動前停止ではrun IDを作らずsource_run_id=nullを保ち</text><text x="67" y="334" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">、元のfailed結果や欠測を成功扱いにしません。</text></g><path d="M 556 368 V 403" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-2"><rect x="42" y="412" width="1028" height="279" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="443" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順2　親A・調査担当（rr-inago-incident-investigation）</text><text x="67" y="473" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="503" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">親A・調査担当は、正常な結果と調査が必要な事象を分けるために、日次結果、許可された証拠索引、既存の</text><text x="67" y="532" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">未解決案件を指定されたSol/xhigh設定でcheckを行い、確認済みの事実・外部要因・未知を分類します</text><text x="67" y="561" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">。</text><text x="67" y="599" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="628" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">親A・調査担当は、正常日や根拠のある不足はcheck記録だけで終了し、異常または未解決の未知だけをinciden</text><text x="67" y="657" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">tへ渡します。</text></g><path d="M 556 691 V 726" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-3"><rect x="42" y="735" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="766" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順3　案件管理プログラム（maintenance controller / store）</text><text x="67" y="796" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="826" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">案件管理プログラムは、同じ起動・障害に一つの永続状態を与えるために、source_launch_id、nulla</text><text x="67" y="855" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">ble source_run_id、target_date、release gate、既存check/incidentを重複を照合し、l</text><text x="67" y="884" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">easeと対象版を保存してから次のstageを受け付けます。</text><text x="67" y="922" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="951" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">案件管理プログラムは、U21 ready前の遡及受付、同一起動の二重check、同一未解決事象の重複incidentを</text><text x="67" y="980" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">許可せず、既存ユーザー変更を保持します。</text></g><path d="M 556 1014 V 1049" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-4"><rect x="42" y="1058" width="1028" height="279" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="1089" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順4　親A・調査/計画担当とreviewer（investigation / execution planning）</text><text x="67" y="1119" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1149" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">親A・調査/計画担当とreviewerは、原因の確度と安全な修正方法を合意するために、証拠付き調査MD、再</text><text x="67" y="1178" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">現範囲、現行要件、実装/受入計画を調査と計画を別の担当が作成・レビューし、未確認を残したまま確定し</text><text x="67" y="1207" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">ます。</text><text x="67" y="1245" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1274" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">親A・調査/計画担当とreviewerは、Error名だけから根本原因を断定せず、必要なログ・要件・再現/回帰ケー</text><text x="67" y="1303" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">スを具体化します。</text></g><path d="M 556 1337 V 1372" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-5"><rect x="42" y="1381" width="1028" height="279" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="1412" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順5　親B・実装/テスト/レビュー担当（common-implementation / testing / review）</text><text x="67" y="1442" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1472" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">親B・実装/テスト/レビュー担当は、再現可能な不具合を隔離した場所で修正するために、合格した計画、m</text><text x="67" y="1501" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">anaged worktree、匿名化された証拠、所有範囲をLuna/max/Fast設定の別担当が修正・試験し、読</text><text x="67" y="1530" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">み取り専用の別reviewerが差分と証拠を確認します。</text><text x="67" y="1568" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1597" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">親B・実装/テスト/レビュー担当は、実装/テスト/レビューの所有を分け、失敗前の証拠と元の日次結果を保ち、</text><text x="67" y="1626" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">合格commit以外を反映しません。</text></g><path d="M 556 1660 V 1695" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-6"><rect x="42" y="1704" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1735" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順6　本番反映プログラム（maintenance deployment）</text><text x="67" y="1765" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1795" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">本番反映プログラムは、合格した正確な版を安全に本番へ届けるために、全必須PASS、独立review、追跡</text><text x="67" y="1824" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">先commit、日次/API稼働状態を排他を確保して通常pushとfast-forwardを行い、active commit</text><text x="67" y="1853" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">・起動設定・healthを照合します。</text><text x="67" y="1891" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1920" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本番反映プログラムは、日次開始中、交差変更、push/ff不能、必須証拠不足なら待機し、非交差の既存変更を</text><text x="67" y="1949" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">消しません。</text></g><path d="M 556 1983 V 2018" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F12-arrow)"/><g class="diagram-node" data-node="F12-7"><rect x="42" y="2027" width="1028" height="279" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="2058" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順7　親B・報告担当とreviewer（rr-inago-incident-report）</text><text x="67" y="2088" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="2118" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">親B・報告担当とreviewerは、何が起き、どこまで直り、次に何を観測するか伝えるために、調査MD、計</text><text x="67" y="2147" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">画MD、試験・review・反映の実測、元件数、次回観測条件を調査MD・計画MD・対応HTMLを作成し、別担</text><text x="67" y="2176" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">当の報告reviewを通します。</text><text x="67" y="2214" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="2243" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">親B・報告担当とreviewerは、元のfailedと修正後の状態を分け、未確認を明記し、次の自然な日次で同じ障</text><text x="67" y="2272" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">害が再発したら同一案件へ結びます。</text></g></svg>