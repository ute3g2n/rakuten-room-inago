<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1697" role="img" aria-labelledby="task-F11-title task-F11-desc" font-family="Yu Gothic, Meiryo, sans-serif"><title id="task-F11-title">動作テストから本番・修正まで</title><desc id="task-F11-desc">この参考図は、実装者と本人が実装後に行うテスト・導入・修正を説明します。本書は、この作業をシステムの業務フローには含めません。各担当が何のために、何をどうするかを全文で説明します。 各ノードの全文は図の直後の文章表示でも読めます。</desc><defs><marker id="task-F11-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61766e"/></marker></defs><rect width="1200" height="1697" fill="#fff"/><text x="40" y="40" font-size="24" font-weight="400" text-anchor="start" fill="#203c34">動作テストから本番・修正まで</text><text x="40" y="78" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">緑：プログラムが実行します。　青：AIが考えます。　橙：本人が操作・判断します。</text><g class="diagram-node" data-node="F11-1"><rect x="42" y="118" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="149" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順1　テスト担当プログラム（S-TEST）</text><text x="67" y="179" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">テスト担当プログラムは、新しい仕組みが要件どおりに動くか確認するために、T内の匿名fixture、時刻</text><text x="67" y="238" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">、停止位置、同時操作、完全nodeと結果台帳をnetwork offのisolated_probeで正常時と失敗時を再</text><text x="67" y="267" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">現し、PASS/FAIL/未実施をcaseごとに記録します。</text><text x="67" y="305" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="334" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">テスト担当プログラムは、本書を読んだだけの確認を動作テストの合格にせず、PASS済みnodeやnested chil</text><text x="67" y="363" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">d suiteを中間STEPで再実行しません。</text></g><path d="M 556 397 V 432" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F11-arrow)"/><g class="diagram-node" data-node="F11-2"><rect x="42" y="441" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="472" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順2　テスト担当プログラム（S-TEST）</text><text x="67" y="502" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="532" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">テスト担当プログラムは、実際の取得画面とAI起動方法が使えるか確かめるために、公開画面からの継続取</text><text x="67" y="561" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">得、店舗・商品番号の取得、無料の人気語取得、AI起動と保存を少量の実データで試し、途中停止後に残り</text><text x="67" y="590" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">だけ再開できるかも確認します。</text><text x="67" y="628" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="657" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">テスト担当プログラムは、CLIというAI起動用の道具が存在するだけで成功とせず、実際に起動・取得・保存でき</text><text x="67" y="686" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">た証拠を残します。</text></g><path d="M 556 720 V 755" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F11-arrow)"/><g class="diagram-node" data-node="F11-3"><rect x="42" y="764" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="795" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順3　テスト担当プログラム（S-TEST）</text><text x="67" y="825" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="855" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">テスト担当プログラムは、本文や投稿履歴を失わずに条件を守れるか確かめるために、二重保存、本文の消</text><text x="67" y="884" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">失、旧台帳の変更、先頭50投稿、第10検索、時刻の切替を検査し、前の作業が早く終われば直ちに成果取得</text><text x="67" y="913" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">へ進むことも確認します。</text><text x="67" y="951" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="980" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">テスト担当プログラムは、日次検索回数の上限なし、80表示でも先頭50受理、17:45/18:00を跨いでも継続、</text><text x="67" y="1009" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">個別timeoutでjobを終了する条件を確認します。</text></g><path d="M 556 1043 V 1078" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F11-arrow)"/><g class="diagram-node" data-node="F11-4"><rect x="42" y="1087" width="1028" height="250" rx="12" fill="#fff2de" stroke="#9a6b30" stroke-width="1.6"/><text x="67" y="1118" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順4　本人と実装担当者（本人／実装担当）</text><text x="67" y="1148" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1178" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">本人と実装担当者は、完成した仕組みを実際の毎日の作業に使うために、完成した実装と動作テストの結果</text><text x="67" y="1207" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">を確認し、テスト合格後は1日15本文を目標とする本番運用を始めます。</text><text x="67" y="1245" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1274" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本人と実装担当者は、固定7日・30日の試験運用を必須にせず、この要件書の更新だけで日次タスクを有効にしま</text><text x="67" y="1303" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">せん。</text></g><path d="M 556 1337 V 1372" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F11-arrow)"/><g class="diagram-node" data-node="F11-5"><rect x="42" y="1381" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1412" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順5　状態確認プログラム（S-STATUS／AG-RECOVERY）</text><text x="67" y="1442" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1472" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">状態確認プログラムは、本番で問題が起きても作成済みの本文を残して修正につなげるために、発生した不</text><text x="67" y="1501" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">具合と保存済みの結果を記録し、本人や保守担当者が必要な修正と関連テストを行えるように表示します。</text><text x="67" y="1539" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1568" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">状態確認プログラムは、必要な場合は復旧説明AIへ診断を依頼しますが、検索上限・時刻・本人投稿という決まり</text><text x="67" y="1597" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">を勝手に緩めません。</text></g></svg>