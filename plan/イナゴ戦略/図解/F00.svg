<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2361" role="img" aria-labelledby="task-F00-title task-F00-desc" font-family="Yu Gothic, Meiryo, sans-serif"><title id="task-F00-title">日次処理を開始し、前日の投稿報告を管理情報へ反映する</title><desc id="task-F00-desc">この詳細図は、全体図の手順1を説明します。日次制御プログラムは、管理反映が完了したら全体図の手順2へ進みます。各担当が何のために、何をどうするかを全文で説明します。 各ノードの全文は図の直後の文章表示でも読めます。</desc><defs><marker id="task-F00-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61766e"/></marker></defs><rect width="1200" height="2361" fill="#fff"/><text x="40" y="40" font-size="24" font-weight="400" text-anchor="start" fill="#203c34">日次処理を開始し、前日の投稿報告を管理情報へ反映する</text><text x="40" y="78" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">緑：プログラムが実行します。　青：AIが考えます。　橙：本人が操作・判断します。</text><g class="diagram-node" data-node="F00-1"><rect x="42" y="118" width="1028" height="221" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="149" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順1　起動受付プログラム（S-TRIGGER）</text><text x="67" y="179" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">起動受付プログラムは、今日の自動日次を始めるために、毎日13:00のスケジューラ起動または本人の日次</text><text x="67" y="238" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">実行依頼を受け取り、Python制御プログラムへ渡します。</text><text x="67" y="276" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="305" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">起動受付プログラムは、本人との対話や夜の投稿を開始待ちの条件にしません。</text></g><path d="M 556 339 V 374" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F00-arrow)"/><g class="diagram-node" data-node="F00-2"><rect x="42" y="383" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="414" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順2　Python制御プログラム（ORCH-S）</text><text x="67" y="444" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="474" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">Python制御プログラムは、同じ日の予算と保存状態を保護してAIへ渡すために、当日のrun、設定版、物</text><text x="67" y="503" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">理ロック、期限、使用済み回数を確認・保存し、AI起動プログラムへ日次指揮AI-Oの起動を依頼します。</text><text x="67" y="541" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="570" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">Python制御プログラムは、スケジューラからAI-Oへ直接渡さず、時刻・上限・排他・状態更新をPythonが管理</text><text x="67" y="599" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">します。</text></g><path d="M 556 633 V 668" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F00-arrow)"/><g class="diagram-node" data-node="F00-3"><rect x="42" y="677" width="1028" height="279" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="708" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順3　日次指揮AI（AI-O）</text><text x="67" y="738" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="768" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">日次指揮AIは、当日の日次を必要な担当へ振り分けるために、Pythonから受けたrun、設定版、checkpo</text><text x="67" y="797" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">intと許可操作を読み、専門役を同じ実行内の内蔵サブエージェントとして呼び、取得・保存は担当プログ</text><text x="67" y="826" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">ラムへ依頼します。</text><text x="67" y="864" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="893" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次指揮AIは、本人との常時対話役ではありません。前日の未反映報告が管理反映される前に候補選出へ進めませ</text><text x="67" y="922" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">ん。</text></g><path d="M 556 956 V 991" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F00-arrow)"/><g class="diagram-node" data-node="F00-4"><rect x="42" y="1000" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1031" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順4　保存担当プログラム（S-REPO）</text><text x="67" y="1061" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1091" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムは、前夜の本人投稿を今日の商品選びへ反映するために、前日の投稿済み・見送り・訂</text><text x="67" y="1120" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">正の報告と、まだ反映していない過去の報告を受付記録から回収し、商品番号・本文の版・報告順・訂正先</text><text x="67" y="1149" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">を確認します。</text><text x="67" y="1187" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1216" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムは、この回収はROOMの売上や反応の取得とは別です。PC停止で残った報告も取りこぼさず、</text><text x="67" y="1245" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">同じ報告を二重に反映しません。</text></g><path d="M 556 1279 V 1314" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F00-arrow)"/><g class="diagram-node" data-node="F00-5"><rect x="42" y="1323" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1354" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順5　保存担当プログラムと日次制御プログラム（S-REPO／ORCH-S）</text><text x="67" y="1384" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1414" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムと日次制御プログラムは、報告の反映と商品探索を正しい設定で進めるために、回収し</text><text x="67" y="1443" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">た報告、現在の予約と投稿済み記録、受領済みの初期設定を照合し、反映する変更と当日使用する設定の版</text><text x="67" y="1472" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">を決めます。</text><text x="67" y="1510" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1539" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムと日次制御プログラムは、事前分析を行わず、別計画で確定した設定を使います。必要な報告</text><text x="67" y="1568" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">の保存・照合に失敗した場合は新しい商品探索を開始しません。</text></g><path d="M 556 1602 V 1637" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F00-arrow)"/><g class="diagram-node" data-node="F00-6"><rect x="42" y="1646" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1677" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順6　保存担当プログラムと日次制御プログラム（S-REPO／ORCH-S）</text><text x="67" y="1707" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1737" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムと日次制御プログラムは、前日の結果を反映した管理情報で今日の商品を選ぶために、</text><text x="67" y="1766" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">投稿済み記録・恒久除外・予約・訂正履歴と、各報告の反映状態を一つのまとまった保存処理で確定し、反</text><text x="67" y="1795" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">映が完了したら日次フロー全体図の手順2へ渡します。</text><text x="67" y="1833" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1862" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムと日次制御プログラムは、本人投稿での予約解除や見送り・訂正はここで管理情報へ反映しま</text><text x="67" y="1891" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">す。反映失敗時は報告を残し、商品探索を停止して理由を表示します。</text></g><path d="M 556 1925 V 1960" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F00-arrow)"/><rect class="flow-transition" x="42" y="1969" width="1028" height="100" rx="10" fill="#e6edf8" stroke="#59649b"/><text x="67" y="1998" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、前日の管理反映が完了した作業を日次フロー全体図の手順2へ渡し、今日のテーマ選</text><text x="67" y="2027" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">択と語句更新を始めます。</text><text x="42" y="2099" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">分かれ道・戻り道の説明</text><text x="42" y="2134" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">13:00は起動受付→手順2のPython制御→手順3のAI-Oへ渡します。AI-Oを省略して通常日次を開始しません。</text><text x="42" y="2183" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、手順6で前日の報告を管理情報へ反映したら日次フロー全体図の手順2へ渡し、商品探しと本文作成を開</text><text x="42" y="2212" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">始します。</text><text x="42" y="2261" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本人は、21:30などの自分が決めた時刻に、独立した「本人が夜に投稿し、投稿済み・見送り・訂正を報告する」フローで投稿</text><text x="42" y="2290" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">します。自動処理は本人投稿を待ちません。</text></svg>