<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1581" role="img" aria-labelledby="task-F10-title task-F10-desc" font-family="Yu Gothic, Meiryo, sans-serif"><title id="task-F10-title">旧履歴から証拠のある実投稿を移行する</title><desc id="task-F10-desc">本人は、導入時などにこの移行フローを依頼します。移行担当プログラムは、毎日の日次処理とは独立して旧実投稿の証拠を登録します。各担当が何のために、何をどうするかを全文で説明します。 各ノードの全文は図の直後の文章表示でも読めます。</desc><defs><marker id="task-F10-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61766e"/></marker></defs><rect width="1200" height="1581" fill="#fff"/><text x="40" y="40" font-size="24" font-weight="400" text-anchor="start" fill="#203c34">旧履歴から証拠のある実投稿を移行する</text><text x="40" y="78" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">緑：プログラムが実行します。　青：AIが考えます。　橙：本人が操作・判断します。</text><g class="diagram-node" data-node="F10-1"><rect x="42" y="118" width="1028" height="221" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="149" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順1　旧履歴の移行担当プログラム（S-MIGRATE）</text><text x="67" y="179" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">旧履歴の移行担当プログラムは、以前に投稿した商品を新しい仕組みでも除外できるようにするために、旧</text><text x="67" y="238" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">スキルの履歴を読取り専用で開き、投稿の証拠がある記録、予定、下書き、判断できない記録に分けます。</text><text x="67" y="276" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="305" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">旧履歴の移行担当プログラムは、旧台帳を書き換えず、予定や下書きを投稿済みだと扱いません。</text></g><path d="M 556 339 V 374" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F10-arrow)"/><g class="diagram-node" data-node="F10-2"><rect x="42" y="383" width="1028" height="221" rx="12" fill="#fff2de" stroke="#9a6b30" stroke-width="1.6"/><text x="67" y="414" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順2　本人（本人）</text><text x="67" y="444" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="474" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">本人は、機械では分からない実投稿の事実を補うために、判断できない履歴と手動で投稿した商品を確認し</text><text x="67" y="503" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">、商品URL、投稿の証拠、または自分の投稿報告を移行担当へ伝えます。</text><text x="67" y="541" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="570" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本人は、AIの推測で投稿済みにせず、本人が分かる範囲の事実だけを報告します。</text></g><path d="M 556 604 V 639" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F10-arrow)"/><g class="diagram-node" data-node="F10-3"><rect x="42" y="648" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="679" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順3　移行担当プログラム（S-MIGRATE）</text><text x="67" y="709" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="739" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">移行担当プログラムは、同じ商品かどうかを新しい仕組みでも判定できるようにするために、商品URLから</text><text x="67" y="768" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">分かる店舗と商品番号を新しい仕組みの表記へそろえ、元の記録を後から確認できる参照番号と一緒に照合</text><text x="67" y="797" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">します。</text><text x="67" y="835" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="864" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">移行担当プログラムは、店舗や商品番号が分からない場合は本人の補完を待ち、架空の番号を作りません。</text></g><path d="M 556 898 V 933" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F10-arrow)"/><g class="diagram-node" data-node="F10-4"><rect x="42" y="942" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="973" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順4　移行担当プログラムと保存担当プログラム（S-MIGRATE／S-REPO）</text><text x="67" y="1003" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1033" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">移行担当プログラムと保存担当プログラムは、証拠のある旧投稿の商品を今後の候補から外すために、確認</text><text x="67" y="1062" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">できた実投稿の記録と店舗・商品番号を新しい保存先へ登録し、同じ元記録を二度取り込まないように管理</text><text x="67" y="1091" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">します。</text><text x="67" y="1129" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1158" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">移行担当プログラムと保存担当プログラムは、移行をやり直しても同じ投稿を二重に数えず、予定や下書きを除外</text><text x="67" y="1187" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">の根拠にしません。</text></g><path d="M 556 1221 V 1256" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F10-arrow)"/><g class="diagram-node" data-node="F10-5"><rect x="42" y="1265" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1296" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順5　移行担当プログラム（S-MIGRATE）</text><text x="67" y="1326" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1356" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">移行担当プログラムは、移した投稿情報の漏れや旧資材への意図しない変更を見つけるために、移行前後の</text><text x="67" y="1385" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">件数、商品番号、元の証拠の参照先を照合し、旧台帳と旧タスクが変更されていないことも確認します。</text><text x="67" y="1423" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1452" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">移行担当プログラムは、旧資材の退避を移行と混ぜず、新しい仕組みが安定したと本人が判断した後の別作業とし</text><text x="67" y="1481" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">て扱います。</text></g></svg>