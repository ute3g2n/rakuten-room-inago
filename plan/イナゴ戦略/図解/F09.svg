<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1726" role="img" aria-labelledby="task-F09-title task-F09-desc" font-family="Yu Gothic, Meiryo, sans-serif"><title id="task-F09-title">結果を保全し、バックアップと復元確認を行う</title><desc id="task-F09-desc">この詳細図は、全体図の手順6の保全処理を説明します。保全プログラムは毎日バックアップを作り、当月の復元確認が未実施の場合だけ検査用領域で読み戻しを確認します。各担当が何のために、何をどうするかを全文で説明します。 各ノードの全文は図の直後の文章表示でも読めます。</desc><defs><marker id="task-F09-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61766e"/></marker></defs><rect width="1200" height="1726" fill="#fff"/><text x="40" y="40" font-size="24" font-weight="400" text-anchor="start" fill="#203c34">結果を保全し、バックアップと復元確認を行う</text><text x="40" y="78" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">緑：プログラムが実行します。　青：AIが考えます。　橙：本人が操作・判断します。</text><g class="diagram-node" data-node="F09-1"><rect x="42" y="118" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="149" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順1　バックアップ担当プログラム（S-BACKUP）</text><text x="67" y="179" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">バックアップ担当プログラムは、保存情報を失った場合に備えるために、本文・投稿履歴などの保存情報と</text><text x="67" y="238" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">必要な設定・作業ファイルを日次作業の終了時に、互いの内容が食い違わない方法で予備コピーへまとめま</text><text x="67" y="267" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">す。</text><text x="67" y="305" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="334" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">バックアップ担当プログラムは、予備コピーの作成に失敗しても、元の保存情報や作成済みの本文を削除しません</text><text x="67" y="363" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">。</text></g><path d="M 556 397 V 432" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F09-arrow)"/><g class="diagram-node" data-node="F09-2"><rect x="42" y="441" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="472" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順2　バックアップ担当プログラム（S-BACKUP）</text><text x="67" y="502" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="532" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">バックアップ担当プログラムは、プロジェクト内の誤削除から保存情報を守るために、予備コピーを同じPC</text><text x="67" y="561" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">のプロジェクト外にある「C:/project/rakuten-room-inago-backups」へ保存し、初期設定では</text><text x="67" y="590" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">直近7回分を残します。</text><text x="67" y="628" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="657" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">バックアップ担当プログラムは、同じPCへのコピーだけではPC自体の故障に備えられないことを状態説明へ記載</text><text x="67" y="686" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">します。</text></g><path d="M 556 720 V 755" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F09-arrow)"/><g class="diagram-node" data-node="F09-3"><rect x="42" y="764" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="795" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順3　復元確認プログラム（S-RESTORE）</text><text x="67" y="825" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="855" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">復元確認プログラムは、予備コピーが実際に読み戻せるか確かめるために、保存した予備コピーを月に1回、</text><text x="67" y="884" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">確認用の別フォルダへ読み戻し、運用中の保存情報とは別に開きます。</text><text x="67" y="922" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="951" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">復元確認プログラムは、本番で使っている保存情報を上書きせず、本番作業の二重起動防止の仕組みも解除しませ</text><text x="67" y="980" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">ん。</text></g><path d="M 556 1014 V 1049" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F09-arrow)"/><g class="diagram-node" data-node="F09-4"><rect x="42" y="1058" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1089" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順4　復元確認プログラム（S-RESTORE）</text><text x="67" y="1119" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1149" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">復元確認プログラムは、投稿済みや投稿待ちの情報が予備コピーにも残っているか確認するために、読み戻</text><text x="67" y="1178" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">した情報の件数、商品番号、投稿済み記録、投稿待ちの目印を照合し、保存情報に食い違いがないかを調べ</text><text x="67" y="1207" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">て結果を記録します。</text><text x="67" y="1245" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1274" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">復元確認プログラムは、保持期限を過ぎて消した詳しい取得記録を、古いコピーから現在の根拠として復活させま</text><text x="67" y="1303" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">せん。</text></g><path d="M 556 1337 V 1372" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F09-arrow)"/><g class="diagram-node" data-node="F09-5"><rect x="42" y="1381" width="1028" height="279" rx="12" fill="#fff2de" stroke="#9a6b30" stroke-width="1.6"/><text x="67" y="1412" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順5　本人または保守担当者（本人／保守担当）</text><text x="67" y="1442" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1472" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">本人または保守担当者は、古いコピーへ戻すことで最近の投稿を忘れた状態にしないようにするために、予</text><text x="67" y="1501" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">備コピーを作った後の実投稿の証拠を照合して不足記録を補い、本番の保存情報を戻す必要があるか判断し</text><text x="67" y="1530" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">ます。</text><text x="67" y="1568" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1597" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本人または保守担当者は、本番への復元が必要な場合だけこの確認を行い、最近の投稿の補完が終わるまで新しい</text><text x="67" y="1626" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">商品選びを再開しません。</text></g></svg>