<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2049" role="img" aria-labelledby="task-F08-title task-F08-desc" font-family="Yu Gothic, Meiryo, sans-serif"><title id="task-F08-title">処理の状態を確認し、停止原因を解消して再開する</title><desc id="task-F08-desc">本人や保守担当者は、このフローで状態確認・復旧を依頼します。日次制御プログラムは、この作業を通常手順に含めず、復旧後は元の日次の未完了箇所へ戻ります。各担当が何のために、何をどうするかを全文で説明します。 各ノードの全文は図の直後の文章表示でも読めます。</desc><defs><marker id="task-F08-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61766e"/></marker></defs><rect width="1200" height="2049" fill="#fff"/><text x="40" y="40" font-size="24" font-weight="400" text-anchor="start" fill="#203c34">処理の状態を確認し、停止原因を解消して再開する</text><text x="40" y="78" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">緑：プログラムが実行します。　青：AIが考えます。　橙：本人が操作・判断します。</text><g class="diagram-node" data-node="F08-1"><rect x="42" y="118" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="149" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順1　状態確認プログラム（S-STATUS）</text><text x="67" y="179" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">状態確認プログラムは、作業が動いているか、止まっているかを見分けるために、定期的な生存記録、作業</text><text x="67" y="238" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">の進み具合、共通traceのactive/last-completed stage、親run相関、残り時間とtrace healt</text><text x="67" y="267" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">hを別々に確認し、正常待機・停止・観測不能を判断根拠と一緒に表示します。</text><text x="67" y="305" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="334" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">状態確認プログラムは、しばらく進捗が出ていないという理由だけでプログラムを強制終了せず、traceが読めな</text><text x="67" y="363" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">い/書けない場合はhealthyとせず不明またはunavailableと表示します。</text></g><path d="M 556 397 V 432" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F08-arrow)"/><g class="diagram-node" data-node="F08-2"><rect x="42" y="441" width="1028" height="308" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="472" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順2　日次制御プログラム（ORCH-S）</text><text x="67" y="502" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="532" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、一時的な取得失敗だけを決めた範囲でやり直すために、一時的な取得エラーになっ</text><text x="67" y="561" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">た作業を終了時刻と当該作業の再試行回数を確認して最大2回まで再実行し、すでに保存した本文は残します</text><text x="67" y="590" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">。</text><text x="67" y="628" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="657" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、ROOMの再呼出も実検索数へ加算しますが日次の数値上限はありません。正常な候補不足</text><text x="67" y="686" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">の次語検索と障害再試行は別です。Trendsは初回込み最大5回、全失敗はテーマ単独ROOM検索へ進む別契約です</text><text x="67" y="715" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">。使用済み回数と17:45を維持します。</text></g><path d="M 556 749 V 784" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F08-arrow)"/><g class="diagram-node" data-node="F08-3"><rect x="42" y="793" width="1028" height="308" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="824" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順3　復旧の説明を担当するAI（AG-RECOVERY）</text><text x="67" y="854" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="884" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">復旧の説明を担当するAIは、本人や保守担当者が停止の原因を調べられるようにするために、秘密情報を除</text><text x="67" y="913" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">いたtraceのrun/request/job相関、active/last-completed stage、primary/cause/cle</text><text x="67" y="942" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">anupのsafe code/class、保存済み結果への参照を読み、観測できた原因・不明点・残りの作業と安全</text><text x="67" y="971" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">な再開案を分けて示します。</text><text x="67" y="1009" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1038" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">復旧の説明を担当するAIは、例外本文・URL/query/header・Cookie・token・商品/投稿本文を求めず、</text><text x="67" y="1067" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本人や保守担当者から頼まれた場合だけ診断し、保存情報の書換えや強制終了を直接行いません。</text></g><path d="M 556 1101 V 1136" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F08-arrow)"/><g class="diagram-node" data-node="F08-4"><rect x="42" y="1145" width="1028" height="221" rx="12" fill="#fff2de" stroke="#9a6b30" stroke-width="1.6"/><text x="67" y="1176" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順4　本人または保守担当者（本人／保守担当）</text><text x="67" y="1206" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1236" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">本人または保守担当者は、停止した原因を解消して正しく再開できるようにするために、ログイン切れ、画</text><text x="67" y="1265" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">面の変更、保存情報の食い違いを確認し、必要なログインやプログラムの修正を行います。</text><text x="67" y="1303" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1332" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本人または保守担当者は、原因を確認してから再開を判断し、無関係なプログラムを終了させません。</text></g><path d="M 556 1366 V 1401" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F08-arrow)"/><g class="diagram-node" data-node="F08-5"><rect x="42" y="1410" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1441" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順5　日次制御プログラム（ORCH-S）</text><text x="67" y="1471" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1501" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、保存済みの本文を作り直さずに残りだけを終えるために、同じ日の保存済み本文、</text><text x="67" y="1530" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">設定、抽選結果、使用済みの試行回数、報告の反映状態を読み、まだ終わっていない作業だけを再開します</text><text x="67" y="1559" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">。</text><text x="67" y="1597" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1626" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、14件が保存済みならその14件を再生成せず、再開時も検索や生成の残り回数を増やしま</text><text x="67" y="1655" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">せん。</text></g><path d="M 556 1689 V 1724" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F08-arrow)"/><g class="diagram-node" data-node="F08-6"><rect x="42" y="1733" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1764" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順6　日次制御プログラムと表示担当プログラム（ORCH-S／S-EXPORT）</text><text x="67" y="1794" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1824" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムと表示担当プログラムは、時刻上限を守りながら残った結果を本人へ渡すために、現在</text><text x="67" y="1853" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">の時刻と未完了の作業を確認し、可能な成果取得または保存済み結果のHTML出力へ進みます。</text><text x="67" y="1891" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1920" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムと表示担当プログラムは、17:45以降は新しい検索と本文生成をせず、18:00以降は新しい</text><text x="67" y="1949" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">成果取得をせず、本人の投稿報告の保存は受け付けます。</text></g></svg>