<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 2380" role="img" aria-labelledby="task-F02-title task-F02-desc" font-family="Yu Gothic, Meiryo, sans-serif"><title id="task-F02-title">日次フロー：前日の報告回収から本文作成・成果取得・納品まで</title><desc id="task-F02-desc">AI-Oが日次の進行を指揮し、Pythonが上限・時刻・保存を管理します。この全体図は、日次処理の手順1～6と、必要件数が不足した時の戻り先を説明します。各担当が何のために、何をどうするかを全文で説明します。 各ノードの全文は図の直後の文章表示でも読めます。</desc><defs><marker id="task-F02-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61766e"/></marker></defs><rect width="1200" height="2380" fill="#fff"/><text x="40" y="40" font-size="24" font-weight="400" text-anchor="start" fill="#203c34">日次フロー：前日の報告回収から本文作成・成果取得・納品まで</text><text x="40" y="78" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">緑：プログラムが実行します。　青：AIが考えます。　橙：本人が操作・判断します。</text><g class="diagram-node" data-node="F02-1"><rect x="42" y="118" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="149" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順1　日次制御プログラムと保存担当プログラム（S-TRIGGER／ORCH-S／S-REPO）</text><text x="67" y="179" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムと保存担当プログラムは、前日の投稿結果を今日の商品選びへ反映するために、前日の</text><text x="67" y="238" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">投稿済み・見送り・訂正と、過去の未反映報告を13:00の開始時に回収し、管理情報と反映済みの印を同時</text><text x="67" y="267" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">に確定します。</text><text x="67" y="305" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="334" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムと保存担当プログラムは、詳しい手順は「日次処理を開始し、前日の投稿報告を管理情報へ反</text><text x="67" y="363" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">映する」です。反映が未完了なら商品探索を開始しません。</text></g><path d="M 556 397 V 432" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F02-arrow)"/><g class="diagram-node" data-node="F02-2"><rect x="42" y="441" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="472" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順2　日次指揮AIと語句担当（AI-O／S-SELECTION／S-TRENDS／AG-KEY）</text><text x="67" y="502" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="532" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">日次指揮AIと語句担当は、取得した語だけでテーマごとの検索候補を用意するために、初期3テーマのうち</text><text x="67" y="561" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">処理中のテーマと関連Top先頭20件を使い、AIが検索語そのものと意味重複を判定し、プログラムが最大5</text><text x="67" y="590" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">グループと各原表現・使用順を均等抽選して保存します。</text><text x="67" y="628" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="657" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次指揮AIと語句担当は、各テーマで5商品を目指します。候補3語なら3語、正常0語ならテーマ単独検索へ進み</text><text x="67" y="686" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">、Trends取得は初回込み最大5回、全失敗ならそのテーマ単独検索へ進みます。</text></g><path d="M 556 720 V 755" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F02-arrow)"/><g class="diagram-node" data-node="F02-3"><rect x="42" y="764" width="1028" height="308" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="795" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順3　商品検索・選択プログラム（S-ROOM／S-SELECTION）</text><text x="67" y="825" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="855" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">商品検索・選択プログラムは、紹介文を作る商品を重複なく集めるために、選択した関連語の原表現、不足</text><text x="67" y="884" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">・正常0語・Trends全5失敗時はテーマ語句そのものをROOM検索へ渡し、いいね300以上・コメント条件な</text><text x="67" y="913" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">しの実反映を確認し、内部順の先頭50投稿から商品を取得順に採用します。</text><text x="67" y="951" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="980" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">商品検索・選択プログラムは、80件表示でも先頭50だけを使います。詳細解決の失敗10件以下は行だけを除外し</text><text x="67" y="1009" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">て検索を継続し、11件以上はpartialとします。失敗行を51件目以降で補わず、日次検索回数に数値上限は設け</text><text x="67" y="1038" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">ません。</text></g><path d="M 556 1072 V 1107" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F02-arrow)"/><g class="diagram-node" data-node="F02-4"><rect x="42" y="1116" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1147" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順4　本文作成AIと保存担当プログラム（AG-COPY／S-AI-RUNNER／S-REPO）</text><text x="67" y="1177" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1207" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">本文作成AIと保存担当プログラムは、本人が貼り付けて使える紹介文を1日15件用意するために、選ばれた</text><text x="67" y="1236" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">各商品の情報と、採用済みの文章の型を読み、日本語の本文を1案ずつ作り、本文・予約・完成件数を商品ご</text><text x="67" y="1265" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">とに確定保存します。</text><text x="67" y="1303" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1332" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本文作成AIと保存担当プログラムは、テーマの枠に不足すれば手順3で次の関連語、使い切ったらテーマ単独へ進</text><text x="67" y="1361" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">みます。5件達成後は次テーマを扱い、初期3テーマ後の不足は追加テーマで補います。</text></g><path d="M 556 1395 V 1430" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F02-arrow)"/><g class="diagram-node" data-node="F02-5"><rect x="42" y="1439" width="1028" height="308" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1470" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順5　日次制御・成果取得・保存プログラム（ORCH-S／S-METRICS／S-REPO）</text><text x="67" y="1500" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1530" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">日次制御・成果取得・保存プログラムは、本文作成の後に実際の売上と投稿反応を記録するために、楽天ア</text><text x="67" y="1559" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">フィリエイトの成果と、自分のROOM投稿への反応を語句更新・検索・本文生成・保存が終わった直後に取得</text><text x="67" y="1588" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">し、取得日時と範囲を分けて保存します。</text><text x="67" y="1626" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1655" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次制御・成果取得・保存プログラムは、詳しい手順は「売上と投稿への反応を取得し、保存する」です。前工程</text><text x="67" y="1684" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">が終わったら時刻を待たず成果へ進み、17:45/18:00を跨いでも同じrunを継続します。各request/proces</text><text x="67" y="1713" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">sは個別の有限timeoutを使います。</text></g><path d="M 556 1747 V 1782" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F02-arrow)"/><g class="diagram-node" data-node="F02-6"><rect x="42" y="1791" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1822" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順6　表示・バックアップ・復元確認プログラム（S-EXPORT／S-BACKUP／S-RESTORE）</text><text x="67" y="1852" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1882" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">表示・バックアップ・復元確認プログラムは、本人へ作成結果を渡し、保存情報の消失に備えるために、保</text><text x="67" y="1911" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">存済み本文、成果、不足理由、管理情報、未反映の受付記録をHTMLへ出力し、日次バックアップを作り、当</text><text x="67" y="1940" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">月の復元確認が未実施の場合は別の検査領域で確認します。</text><text x="67" y="1978" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="2007" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">表示・バックアップ・復元確認プログラムは、保全の詳しい手順は「結果を保全し、バックアップと復元確認を行</text><text x="67" y="2036" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">う」です。日次は本人の夜の投稿を待たず終了し、その報告は翌日の手順1が回収します。</text></g><path d="M 1070 1255.5 H 1134 V 918 H 1074" fill="none" stroke="#61766e" stroke-width="2.5" stroke-dasharray="6 5" marker-end="url(#task-F02-arrow)"/><text x="42" y="2118" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">分かれ道・戻り道の説明</text><text x="42" y="2153" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、現在テーマの枠に不足する場合、手順3で次の関連語、使い切ったらテーマ単独を検索します。テーマ</text><text x="42" y="2182" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">処理後は次テーマのため手順2へ戻り、初期3テーマ後も15未達なら別テーマで補います。</text><text x="42" y="2231" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、検索回数に数値上限を設けません。15件達成・未試行候補枯渇・取得不能で前工程が終わると、直ちに</text><text x="42" y="2260" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">手順5の成果取得へ進みます。17:45/18:00を跨いでも日次全体を打ち切りません。</text><text x="42" y="2309" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本人は21:30などに独立して投稿します。その報告を翌日の日次の手順1が回収し、自動処理は本人投稿を待ちません。</text></svg>