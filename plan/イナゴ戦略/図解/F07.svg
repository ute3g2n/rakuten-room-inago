<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1846" role="img" aria-labelledby="task-F07-title task-F07-desc" font-family="Yu Gothic, Meiryo, sans-serif"><title id="task-F07-title">本人が成果を確認し、必要に応じて設定を変更する</title><desc id="task-F07-desc">本人は、必要な時にこのフローを依頼します。日次制御プログラムは、この作業を毎日の必須工程に含めず、本人が採用した設定を次の日次で使います。各担当が何のために、何をどうするかを全文で説明します。 各ノードの全文は図の直後の文章表示でも読めます。</desc><defs><marker id="task-F07-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61766e"/></marker></defs><rect width="1200" height="1846" fill="#fff"/><text x="40" y="40" font-size="24" font-weight="400" text-anchor="start" fill="#203c34">本人が成果を確認し、必要に応じて設定を変更する</text><text x="40" y="78" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">緑：プログラムが実行します。　青：AIが考えます。　橙：本人が操作・判断します。</text><g class="diagram-node" data-node="F07-1"><rect x="42" y="118" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="149" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順1　集計担当プログラム（S-STATS）</text><text x="67" y="179" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">集計担当プログラムは、本人が商品の集まり方と投稿後の結果を比べられるようにするために、検索結果の</text><text x="67" y="238" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">商品数、本文数、実投稿数、反応、取得できた収益を表にまとめ、情報不足・投稿待ち・取得障害による不</text><text x="67" y="267" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">足を別々に表示します。</text><text x="67" y="305" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="334" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">集計担当プログラムは、特定の商品からの売上と確認できない数値を、その商品の売上として表示しません。</text></g><path d="M 556 368 V 403" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F07-arrow)"/><g class="diagram-node" data-node="F07-2"><rect x="42" y="412" width="1028" height="250" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="443" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順2　成果の説明を担当するAI（AG-INSIGHT）</text><text x="67" y="473" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="503" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">成果の説明を担当するAIは、本人が条件の違う結果を同じものとして比べないようにするために、集計した</text><text x="67" y="532" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">表と元の取得記録を読み、比較できる条件と根拠を示し、投稿数が少ない場合や情報が欠けている場合の限</text><text x="67" y="561" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">界も説明します。</text><text x="67" y="599" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="628" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">成果の説明を担当するAIは、説明だけでテーマや文章の型を自動変更せず、変更案があれば本人へ提案します。</text></g><path d="M 556 662 V 697" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F07-arrow)"/><g class="diagram-node" data-node="F07-3"><rect x="42" y="706" width="1028" height="221" rx="12" fill="#fff2de" stroke="#9a6b30" stroke-width="1.6"/><text x="67" y="737" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順3　本人（本人）</text><text x="67" y="767" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="797" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">本人は、自分の方針に合わせて商品分野や文章を改善するために、変更したいテーマや文章の型を選び、維</text><text x="67" y="826" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">持したい条件と変更理由を設定変更AIへ伝えます。</text><text x="67" y="864" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="893" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本人は、必要だと感じた時に変更を依頼し、固定の周期での入替えを義務にしません。</text></g><path d="M 556 927 V 962" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F07-arrow)"/><g class="diagram-node" data-node="F07-4"><rect x="42" y="971" width="1028" height="250" rx="12" fill="#eef0fb" stroke="#59649b" stroke-width="1.6"/><text x="67" y="1002" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順4　設定変更AI（AG-CONFIG）</text><text x="67" y="1032" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1062" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">設定変更AIは、本人が変更前と変更後の違いを確認できるようにするために、現在の設定と本人の変更希望</text><text x="67" y="1091" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">を読み、5分野に各6テーマを保った変更案と、文章の型の変更内容を提案します。</text><text x="67" y="1129" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1158" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">設定変更AIは、意味が変わるテーマには新しい番号を付ける案を示し、本人が採用する前に設定を有効にしません</text><text x="67" y="1187" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">。</text></g><path d="M 556 1221 V 1256" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F07-arrow)"/><g class="diagram-node" data-node="F07-5"><rect x="42" y="1265" width="1028" height="221" rx="12" fill="#fff2de" stroke="#9a6b30" stroke-width="1.6"/><text x="67" y="1296" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順5　本人（本人）</text><text x="67" y="1326" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1356" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">本人は、実際に使う設定を自分で決めるために、AIの変更案と変更前後の違いを確認し、使う内容を選んで</text><text x="67" y="1385" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">採用します。</text><text x="67" y="1423" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1452" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本人は、変更を取り消す場合も、どの設定へ戻したかという履歴を残すよう指定します。</text></g><path d="M 556 1486 V 1521" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F07-arrow)"/><g class="diagram-node" data-node="F07-6"><rect x="42" y="1530" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1561" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順6　保存担当プログラム（S-REPO）</text><text x="67" y="1591" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1621" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムは、新しい設定を次の作業で使い、過去の投稿記録を守るために、本人が採用した設定</text><text x="67" y="1650" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">を新しい版として保存し、新しいテーマの選択回数を0から数えます。</text><text x="67" y="1688" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1717" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムは、進行中の作業には開始時の設定を使い続け、投稿済み商品の除外と未解決の投稿待ちを巻</text><text x="67" y="1746" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">き戻しません。</text></g></svg>