<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1834" role="img" aria-labelledby="task-F06-title task-F06-desc" font-family="Yu Gothic, Meiryo, sans-serif"><title id="task-F06-title">売上と投稿への反応を取得し、保存する</title><desc id="task-F06-desc">この詳細図は、全体図の手順5を説明します。日次制御プログラムは成果取得が終わるか18:00に達したら全体図の手順6へ進みます。各担当が何のために、何をどうするかを全文で説明します。 各ノードの全文は図の直後の文章表示でも読めます。</desc><defs><marker id="task-F06-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#61766e"/></marker></defs><rect width="1200" height="1834" fill="#fff"/><text x="40" y="40" font-size="24" font-weight="400" text-anchor="start" fill="#203c34">売上と投稿への反応を取得し、保存する</text><text x="40" y="78" font-size="18" font-weight="400" text-anchor="start" fill="#203c34">緑：プログラムが実行します。　青：AIが考えます。　橙：本人が操作・判断します。</text><g class="diagram-node" data-node="F06-1"><rect x="42" y="118" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="149" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順1　日次制御プログラム（ORCH-S）</text><text x="67" y="179" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="209" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、紹介文作りの後に売上や反応をすぐ確認するために、語句更新・検索・本文生成・</text><text x="67" y="238" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">保存の終了を確認し、終わった直後に成果取得担当プログラムを動かします。</text><text x="67" y="276" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="305" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、13:20に終わればその時点で成果取得を始め、17:45まで待たず、長引いた場合だけ17:</text><text x="67" y="334" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">45で前の作業を打ち切ります。</text></g><path d="M 556 368 V 403" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F06-arrow)"/><g class="diagram-node" data-node="F06-2"><rect x="42" y="412" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="443" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順2　成果取得担当プログラム（S-METRICS）</text><text x="67" y="473" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="503" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">成果取得担当プログラムは、楽天アフィリエイトで発生した成果を日付別に確認するために、前日から最大7</text><text x="67" y="532" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">日間の日別成果と、当月・前月の公式注文明細を現行の化け物・改と同じ方法で読み取り、取得した数値と</text><text x="67" y="561" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">明細を保存へ渡します。</text><text x="67" y="599" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="628" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">成果取得担当プログラムは、本人が管理しているログイン方法を使い、ログインできない場合は取得できなかった</text><text x="67" y="657" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">理由を記録します。</text></g><path d="M 556 691 V 726" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F06-arrow)"/><g class="diagram-node" data-node="F06-3"><rect x="42" y="735" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="766" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順3　成果取得担当プログラム（S-METRICS）</text><text x="67" y="796" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="826" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">成果取得担当プログラムは、自分が公開したROOM投稿への反応を確認するために、自分のROOMの直近30日</text><text x="67" y="855" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">間の公開投稿を読み取り、日次開始時に反映した前日の投稿記録と照らし合わせて、取れた反応の数と取得</text><text x="67" y="884" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">日時を記録します。</text><text x="67" y="922" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="951" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">成果取得担当プログラムは、まだ投稿していない本文へ反応0を付けず、読み取れない反応を取得できた0と区別し</text><text x="67" y="980" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">ます。</text></g><path d="M 556 1014 V 1049" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F06-arrow)"/><g class="diagram-node" data-node="F06-4"><rect x="42" y="1058" width="1028" height="250" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1089" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順4　保存担当プログラム（S-REPO）</text><text x="67" y="1119" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1149" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムは、売上の合計と個々の投稿の反応を混同しないようにするために、日別成果、注文ご</text><text x="67" y="1178" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">との明細、投稿ごとの反応をそれぞれが何の範囲の数値かと取得日時を付け、分けて保存します。</text><text x="67" y="1216" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1245" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">保存担当プログラムは、どの投稿から発生したか分からない日別売上を各商品へ割り振らず、取得できない値は不</text><text x="67" y="1274" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">明として残します。</text></g><path d="M 556 1308 V 1343" fill="none" stroke="#61766e" stroke-width="2.5" marker-end="url(#task-F06-arrow)"/><g class="diagram-node" data-node="F06-5"><rect x="42" y="1352" width="1028" height="279" rx="12" fill="#e9f5f0" stroke="#39735d" stroke-width="1.6"/><text x="67" y="1383" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">手順5　表示担当プログラムと日次制御プログラム（S-EXPORT／ORCH-S）</text><text x="67" y="1413" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">何のために、何をどうするか</text><text x="67" y="1443" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">表示担当プログラムと日次制御プログラムは、本人が本文と成果取得の結果を確認できるようにするために</text><text x="67" y="1472" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">、保存済みの本文と、取得できた成果・取得できなかった項目をHTMLへ表示し、成果取得の工程を終了して</text><text x="67" y="1501" font-size="20" font-weight="400" text-anchor="start" fill="#203c34">日次全体の手順6の保全処理へ渡します。</text><text x="67" y="1539" font-size="15" font-weight="700" text-anchor="start" fill="#203c34">条件・注意点</text><text x="67" y="1568" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">表示担当プログラムと日次制御プログラムは、早く終われば18:00まで待たず、取得が長引いた場合は18:00で</text><text x="67" y="1597" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">取得を終了し、未取得の項目と理由を表示します。</text></g><text x="42" y="1679" font-size="20" font-weight="700" text-anchor="start" fill="#203c34">分かれ道・戻り道の説明</text><text x="42" y="1714" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">日次制御プログラムは、成果取得が完了するか18:00に達したら、日次全体の手順6へ進みます。</text><text x="42" y="1763" font-size="19" font-weight="400" text-anchor="start" fill="#203c34">本人は、成果説明AIによる解釈が必要な時だけ、日次とは独立した成果確認・設定変更フローを依頼します。</text></svg>